name: Network Supplier API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------
  # JOB 1: Docker Image Build aur Docker Hub par Push Karna
  # ---------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # Only push on direct push/merge to main, not PRs
          tags: ${{ secrets.DOCKER_USERNAME }}/network-supplier-api:latest

  # ---------------------------------------------------------
  # JOB 2: Server par Deploy Karna (via SSH)
  # ---------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Sirf tab deploy karein jab changes directly 'main' branch par push ya merge ho
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ayaz/network-supplier-api"
          overwrite: true

      - name: Run Deploy Commands on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Deploying application..."
            cd /home/ayaz/network-supplier-api
            
            # Pull the newly pushed latest image
            docker compose pull
            
            # Restart application container with new image
            docker compose up -d --force-recreate
            
            # Remove old unused docker images to save disk space
            docker image prune -f
            echo "Deployment Successful!"
